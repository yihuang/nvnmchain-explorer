name: Docker

# Builds the explorer image and publishes it to GitHub Container Registry:
#   ghcr.io/<owner>/nvnmchain-explorer:latest
#   ghcr.io/<owner>/nvnmchain-explorer:sha-<commit>
#   ghcr.io/<owner>/nvnmchain-explorer:<tag>        (on v* tags)

on:
  push:
    branches: ["main"]
    tags: ["v*"]

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    name: Build & push GHCR image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          driver: docker-container

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: meta
        shell: bash
        run: |
          IMAGE="ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
          SHORT_SHA="${GITHUB_SHA::7}"
          TAGS="${IMAGE}:latest,${IMAGE}:sha-${SHORT_SHA}"
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            TAGS="${TAGS},${IMAGE}:${GITHUB_REF_NAME}"
          fi
          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Deploys the app to Fly.io on every main push / release tag. The image is
  # built from the repo Dockerfile on Fly's remote builder (fly.toml has no
  # image pin), so deploys don't depend on GHCR. Runs independently of
  # build-and-push so a GHCR hiccup never blocks the app going live.
  #
  # Set the repo secret FLY_API_TOKEN first:
  #   fly tokens create deploy -x 2160h
  deploy-to-fly:
    name: Deploy to Fly.io
    runs-on: ubuntu-latest
    if: github.repository_owner == 'yihuang'
    steps:
      - uses: actions/checkout@v5

      - name: Install flyctl
        run: |
          curl -fsSL https://fly.io/install.sh | sh
          echo "$HOME/.fly/bin" >> "$GITHUB_PATH"

      - name: Deploy
        run: fly deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
