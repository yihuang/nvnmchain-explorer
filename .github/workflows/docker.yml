name: Docker

# Builds the explorer image and publishes it to GitHub Container Registry:
#   ghcr.io/<owner>/nvnmchain-explorer:latest
#   ghcr.io/<owner>/nvnmchain-explorer:sha-<commit>
#   ghcr.io/<owner>/nvnmchain-explorer:<tag>        (on v* tags)
#
# Each arch builds on a runner of its own arch and pushes a digest-only image;
# a merge job joins the digests into one multi-arch manifest and tags that.

on:
  push:
    branches: ["main"]
    tags: ["v*"]

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          driver: docker-container

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image name and cache tag
        id: meta
        shell: bash
        run: |
          echo "image=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
          # One cache tag per arch: the two builds export concurrently.
          echo "arch=$(echo '${{ matrix.platform }}' | tr '/' '-')" >> "$GITHUB_OUTPUT"

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ steps.meta.outputs.image }},push-by-digest=true,name-canonical=true,push=true
          # GHCR rather than the Actions cache: mode=max stores the builder's
          # `target` dir, and two of those exceed the 10GB repo quota, past
          # which eviction makes builds cold at random. A registry tag has no
          # quota and is rewritten in place.
          cache-from: type=registry,ref=${{ steps.meta.outputs.image }}:buildcache-${{ steps.meta.outputs.arch }}
          cache-to: type=registry,ref=${{ steps.meta.outputs.image }}:buildcache-${{ steps.meta.outputs.arch }},mode=max

      - name: Export digest
        shell: bash
        run: |
          mkdir -p "${{ runner.temp }}/digests"
          digest='${{ steps.build.outputs.digest }}'
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ steps.meta.outputs.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: Push GHCR manifest
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push manifest list
        shell: bash
        working-directory: ${{ runner.temp }}/digests
        run: |
          IMAGE="ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
          SHORT_SHA="${GITHUB_SHA::7}"
          TAGS=(-t "${IMAGE}:latest" -t "${IMAGE}:sha-${SHORT_SHA}")
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            TAGS+=(-t "${IMAGE}:${GITHUB_REF_NAME}")
          fi
          # One file per arch, named after the digest it built.
          REFS=()
          for digest in *; do
            REFS+=("${IMAGE}@sha256:${digest}")
          done
          docker buildx imagetools create "${TAGS[@]}" "${REFS[@]}"
          docker buildx imagetools inspect "${IMAGE}:sha-${SHORT_SHA}"

  # Deploys the app to Fly.io on every main push / release tag. The image is
  # built from the repo Dockerfile on Fly's remote builder (fly.toml has no
  # image pin), so deploys don't depend on GHCR. Runs independently of the
  # build jobs so a GHCR hiccup never blocks the app going live.
  #
  # Set the repo secret FLY_API_TOKEN first:
  #   fly tokens create deploy -x 2160h
  deploy-to-fly:
    name: Deploy to Fly.io
    runs-on: ubuntu-latest
    if: github.repository_owner == 'yihuang'
    steps:
      - uses: actions/checkout@v5

      - name: Install flyctl
        run: |
          curl -fsSL https://fly.io/install.sh | sh
          echo "$HOME/.fly/bin" >> "$GITHUB_PATH"

      - name: Deploy
        run: fly deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
