# Fly.io configuration for nvnmchain-explorer.
#
# Deploy:
#   fly launch --dockerfile Dockerfile --no-deploy
#   fly volumes create nvnm_data --size 5   (5 GB: full backfill is ~1.2 GB raw + indexes)
#   fly deploy
#
# The app gets a free <app>.fly.dev subdomain with TLS — no domain purchase
# needed. The indexer runs inside the web process, so keep the machine
# always-on (do NOT enable scale-to-zero / autostop).

app = "nvnmchain-explorer"
primary_region = "hkg"

[build]
  dockerfile = "Dockerfile"

[env]
  DB_PATH = "/data/explorer.db"
  RUST_LOG = "nvnmchain_explorer=info"
  INDEX_WS = "0"
  NATIVE_SYMBOL = "NVNM"

[mounts]
  source = "nvnm_data"
  destination = "/data"

[[services]]
  internal_port = 8080
  protocol = "tcp"
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [services.concurrency]
    type = "connections"
    hard_limit = 200
    soft_limit = 100

  [[services.ports]]
    handlers = ["http"]
    port = 80

  [[services.ports]]
    handlers = ["tls", "http"]
    port = 443

  [[services.http_checks]]
    interval = "15s"
    timeout = "3s"
    grace_period = "30s"
    method = "GET"
    path = "/"
