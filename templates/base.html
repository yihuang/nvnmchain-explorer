<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <title>{% block title %}nvnmchain Explorer{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background: radial-gradient(1200px 500px at 50% -10%, #131324 0%, #0a0a0f 55%) fixed; color: #e0e0e0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
        a { color: #60a5fa; text-decoration: none; }
        a:hover { color: #93c5fd; text-decoration: underline; }
        .card { background: rgba(19,19,26,0.9); border: 1px solid #1e1e2a; border-radius: 12px; backdrop-filter: blur(4px); }
        .card-header { border-bottom: 1px solid #1e1e2a; padding: 16px 20px; font-weight: 600; font-size: 14px; color: #a0a0b0; text-transform: uppercase; letter-spacing: 0.05em; }
        .card-body { padding: 16px 20px; }
        .table-header { color: #7a7a8a; font-size: 12px; text-transform: uppercase; letter-spacing: 0.05em; font-weight: 600; padding: 8px 0; border-bottom: 1px solid #1e1e2a; }
        .t-row { border-bottom: 1px solid #14141e; }
        .t-row:last-child { border-bottom: none; }
        .t-row:hover { background: #1a1a26; }
        .table-cell { padding: 10px 12px; font-size: 13px; }
        .tab { padding: 8px 16px; font-size: 13px; border-bottom: 2px solid transparent; cursor: pointer; color: #7a7a8a; }
        .tab.active { color: #60a5fa; border-bottom-color: #60a5fa; }
        .tab:hover { color: #a0a0b0; }
        .badge { display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px; border-radius: 9999px; font-size: 11px; font-weight: 500; }
        .badge-success { background: #065f46; color: #6ee7b7; }
        .badge-error { background: #7f1d1d; color: #fca5a5; }
        .badge-info { background: #1e3a5f; color: #93c5fd; }
        .badge-warn { background: #5c4a00; color: #fcd34d; }
        .label-precompile { background: #312e81; color: #a5b4fc; }
        .label-token { background: #065f46; color: #6ee7b7; }
        .label-contract { background: #3730a3; color: #c7d2fe; }
        .hash-link { font-family: 'SF Mono', 'Fira Code', monospace; font-size: 12px; }
        .value-positive { color: #6ee7b7; }
        .value-negative { color: #fca5a5; }
        .mono { font-family: 'SF Mono', 'Fira Code', 'Consolas', monospace; }
        .text-dim { color: #7a7a8a; }
        .search-input { background: #1a1a26; border: 1px solid #2a2a3a; border-radius: 10px; padding: 10px 16px; color: #e0e0e0; width: 100%; outline: none; font-size: 14px; }
        .search-input:focus { border-color: #60a5fa; }
        .search-input::placeholder { color: #5a5a6a; }
        .nav-link { color: #a0a0b0; font-size: 13px; padding: 6px 12px; border-radius: 8px; }
        .nav-link:hover { background: #1a1a26; color: #e0e0e0; text-decoration: none; }
        .stat-value { font-size: 24px; font-weight: 700; color: #f0f0f0; }
        .stat-value.accent { background: linear-gradient(90deg, #60a5fa, #a78bfa); -webkit-background-clip: text; background-clip: text; color: transparent; }
        .stat-label { font-size: 12px; color: #7a7a8a; text-transform: uppercase; letter-spacing: 0.05em; }
        .section-title { font-size: 14px; font-weight: 600; color: #c0c0d0; margin-bottom: 12px; }
        .divider { border-color: #1e1e2a; }
        .pre-wrap { white-space: pre-wrap; word-break: break-all; }
        footer { border-top: 1px solid #1e1e2a; margin-top: 48px; }
    </style>
</head>
<body>
    <nav class="border-b border-[#1e1e2a] sticky top-0 z-50" style="background: rgba(10,10,15,0.95); backdrop-filter: blur(8px);">
        <div class="max-w-7xl mx-auto px-4">
            <div class="flex items-center justify-between h-14">
                <div class="flex items-center gap-6">
                    <a href="/" class="font-bold text-lg text-white hover:text-blue-400 hover:no-underline">
                        <span class="text-blue-400">⏺</span> nvnmchain
                    </a>
                    <div class="hidden md:flex items-center gap-1">
                        <a href="/" class="nav-link">Home</a>
                        <a href="/blocks" class="nav-link">Blocks</a>
                        <a href="/tokens" class="nav-link">Tokens</a>
                    </div>
                </div>
                <div class="flex items-center gap-3">
                    <span class="text-xs text-dim">Chain</span>
                    {% if latest_block %}
                    <a href="/block/{{ latest_block.number }}" class="text-xs text-dim hover:text-blue-400 hover:no-underline" title="View latest block">
                        #{{ latest_block.number }}
                    </a>
                    {% endif %}
                </div>
            </div>
            <div class="pb-3">
                <form action="/search" method="GET" class="max-w-2xl mx-auto">
                    <input type="text" name="q" placeholder="Search by block number / tx hash / address / token" class="search-input" value="{{ query }}">
                </form>
            </div>
        </div>
    </nav>
    <main class="max-w-7xl mx-auto px-4 py-6">
        {% block content %}{% endblock %}
    </main>
    <footer>
        <div class="max-w-7xl mx-auto px-4 py-6 text-xs text-dim flex flex-wrap items-center justify-between gap-2">
            <span>⏺ nvnmchain — chain explorer</span>
            <span class="mono">{% if latest_block %}#{{ latest_block.number }}{% endif %} · <a href="https://rpc.nvnm.canary.mantrachain.dev" target="_blank" class="hover:text-blue-300">RPC</a></span>
        </div>
    </footer>
</body>
</html>
